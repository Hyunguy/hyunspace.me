  <!-- Google Fonts: Bricolage Grotesque, Manrope, JetBrains Mono -->

  <style>
    :root {
      --bg: #FFFFFF;
      --bg-elevated: #F4F5F7;
      --ink: #000000;
      --muted: #555555;
      --accent-warm: #E60000;
      --accent-cool: #0044FF;
      --card-bg: rgba(255, 255, 255, 0.92);
      --border-color: rgba(0, 0, 0, 0.15);
    }

    html.dark {
      --bg: #0B0D10;
      --bg-elevated: #14171C;
      --ink: #ECEEF2;
      --muted: #8890A0;
      --accent-warm: #FF9457;
      --accent-cool: #29D3E8;
      --card-bg: rgba(20, 23, 28, 0.92);
      --border-color: rgba(255, 255, 255, 0.15);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Manrope', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Black highlight box for pxlhvk typography */
    .hl-box {
      background-color: var(--ink);
      color: var(--bg);
      padding: 1px 5px;
      font-weight: 800;
      display: inline;
    }

    /* Checker seam divider rule */
    .checker-seam {
      height: 12px;
      width: 100%;
      background-image: linear-gradient(45deg, #000000 25%, transparent 25%),
                        linear-gradient(-45deg, #000000 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #000000 75%),
                        linear-gradient(-45deg, transparent 75%, #000000 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0px;
      opacity: 0.15;
    }

    html.dark .checker-seam {
      background-image: linear-gradient(45deg, #FFFFFF 25%, transparent 25%),
                        linear-gradient(-45deg, #FFFFFF 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #FFFFFF 75%),
                        linear-gradient(-45deg, transparent 75%, #FFFFFF 75%);
      opacity: 0.2;
    }

    /* Custom scrollbar for modal overlays */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--ink);
      border-radius: 2px;
    }

    /* One print-grain layer sits above both WebGL and DOM typography. */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.075;
      background-image: radial-gradient(circle, #000 0 0.55px, transparent 0.75px);
      background-size: 4px 4px;
      mix-blend-mode: multiply;
    }
  </style>
